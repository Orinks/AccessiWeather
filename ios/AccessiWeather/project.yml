name: AccessiWeather
options:
  bundleIdPrefix: net.orinks
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  AccessiWeather:
    type: application
    platform: iOS
    sources:
      - path: AccessiWeather
        excludes:
          - Resources/SoundPacks/**
      - path: AccessiWeather/Resources/SoundPacks
        type: folder
    info:
      path: AccessiWeather/Info.plist
      properties:
        UIBackgroundModes: [audio]
        # Volunteer NOAA relays often lack forward-secrecy ciphers; relax ATS for AVFoundation media only.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsForMedia: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.orinks.AccessiWeather
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: AccessiWeather
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "AccessiWeather uses your location to find weather for where you are when you choose Use Current Location."
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: "YES"
  AccessiWeatherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AccessiWeatherUITests
    dependencies:
      - target: AccessiWeather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.orinks.AccessiWeatherUITests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: AccessiWeather
schemes:
  AccessiWeather:
    build:
      targets:
        AccessiWeather: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AccessiWeatherUITests
    archive:
      config: Release
