# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Python/pip was removed: the ship and test path is the Rust edition under rust/.
# Development happens on dev; main only ever receives merges from it.

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/rust"
    target-branch: "dev"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
