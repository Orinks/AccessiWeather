default_install_hook_types: [pre-commit, commit-msg]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files

-   repo: local
    hooks:
    # Rejects a user-facing commit that adds no CHANGELOG.md Unreleased bullet
    # to what origin/dev (origin/main on main) lacks; git passes the message file.
    -   id: changelog-check
        name: changelog check
        entry: cargo run --quiet --manifest-path rust/Cargo.toml --package xtask -- changelog check --base auto --staged
        language: system
        stages: [commit-msg]
