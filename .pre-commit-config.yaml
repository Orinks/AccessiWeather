default_install_hook_types: [pre-commit, commit-msg]

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
        exclude: ^src/accessiweather/weather_gov_api_client/
    -   id: end-of-file-fixer
        exclude: ^src/accessiweather/weather_gov_api_client/
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: debug-statements

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
    -   id: ruff
        args: [--fix]
        files: ^(src/|tests/)
        exclude: ^src/accessiweather/(weather_gov_api_client|weatherapi_client)/
    -   id: ruff-format
        files: ^(src/|tests/)
        exclude: ^src/accessiweather/(weather_gov_api_client|weatherapi_client)/

-   repo: local
    hooks:
    # Rejects a user-facing commit that adds no CHANGELOG.md Unreleased bullet
    # to what origin/dev (origin/main on main) lacks; git passes the message file.
    -   id: changelog-check
        name: changelog check
        entry: cargo run --quiet --manifest-path rust/Cargo.toml --package xtask -- changelog check --base auto --staged
        language: system
        stages: [commit-msg]
