[package]
name = "accessiweather"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "AccessiWeather: accessible desktop weather (native Rust)"

[[bin]]
name = "accessiweather"
path = "src/main.rs"

[dependencies]
aw-core.workspace = true
aw-providers.workspace = true
aw-store.workspace = true
aw-audio.workspace = true
prismer.workspace = true
wxdragon.workspace = true
clap.workspace = true
thiserror.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Static on Windows (one self-contained .exe); elsewhere prism is a shared
# library shipped beside the executable.
[target.'cfg(windows)'.dependencies]
prismer = { workspace = true, features = ["static"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
embed-manifest = "1.4"
