[package]
name = "aw-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Weather data providers (NWS, Open-Meteo, geocoding) for AccessiWeather"

[dependencies]
aw-core.workspace = true
aw-store.workspace = true
serde.workspace = true
# float_roundtrip: parse floats exactly like Python's json (golden parity).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
tracing.workspace = true
reqwest.workspace = true
url.workspace = true
deunicode = "1"
regex = "1"
sha1 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation", "Foundation"] }
windows-future = "0.3"

[dev-dependencies]
aw-core = { workspace = true, features = ["golden"] }
tempfile.workspace = true
